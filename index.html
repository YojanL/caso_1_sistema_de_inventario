<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1">
    <title>
        Inicio de Sesion
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="card shadow-sm mx-auto"
        style="max-width: 500px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Hola!!</h1>
                <p class="text-secondary">Ingrese al sistema con sus credenciales</p>
                <form action="inicio_sesion.php"
                    method="post">
                    <div class="row g-3">
                        <div>
                            <label for="usuario"
                            class="form-label">
                                Nombre de Usuario
                            </label>
                                <input type="text"
                                    class="form-control"
                                    id="usuario"
                                    name="usuario"
                                    maxlength="20"
                                    required>
                        </div>
                        <div>
                            <label for="clave"
                            class="form-label">
                                Contraseña
                            </label>
                            <div class="input-group">
                                <input type="password"
                                    class="form-control"
                                    id="clave"
                                    name="clave"
                                    required>
                                <button class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword">
                                    <i class="bi bi-eye" id="iconoOjo"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit"
                                class="btn btn-primary">
                                Ingresar
                            </button>
                            <button type="reset"
                            class="btn btn-outline-secondary">
                                Limpiar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    <script>
        const inputClave = document.getElementById('clave');
        const btnToggle = document.getElementById('togglePassword');
        const iconoOjo = document.getElementById('iconoOjo');

        btnToggle.addEventListener('click', function () {
            // 1. Alternar el tipo de input entre 'password' y 'text'
            const tipo = inputClave.getAttribute('type') === 'password' ? 'text' : 'password';
            inputClave.setAttribute('type', tipo);

            // 2. Cambiar el ícono del ojo (bi-eye / bi-eye-slash)
            iconoOjo.classList.toggle('bi-eye');
            iconoOjo.classList.toggle('bi-eye-slash');
        });
    </script>
    </main>
</body>
</html>
